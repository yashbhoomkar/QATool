[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-vis"
version = "0.1.0"
description = "Local code visualizer for Python repos: build a graph of dirs/files/entities and serve a web UI."
authors = [{ name = "Yash Bhoomkar" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "libcst>=1.4",
  "typer>=0.12",            # friendly CLI
  "rich>=13.7",             # pretty logs/progress (optional but nice)
  "watchfiles>=0.22",       # optional: file watching for rescans
  "radon>=6.0"              # optional: complexity metrics
]

[project.scripts]
qa-vis = "app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
